<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integrales</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <span class="site-header__brand">Resolver</span>
    <nav class="site-header__nav">
      <a href="index.html">Sistemas Eq</a>
      <a href="integral.html" aria-current="page">Integrales</a>
      <a href="ayuda.html">Ayuda</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar entre modo oscuro y claro">☀️</button>
  </header>

  <main>
    <h1>Integrales</h1>

    <!-- 1. Variables conocidas -->
    <section class="card">
      <h2>1 · Variables definidas</h2>
      <div id="knowns-list" class="row-list"></div>
      <button type="button" class="btn-add" id="add-known">+ Agregar variable</button>
    </section>

    <!-- 2. Integral -->
    <section class="card">
      <h2>2 · Integral</h2>

      <div class="integral-row">
        <div class="integral-symbol">
          <input type="text" id="upper-bound" class="bound-input" placeholder="π" />
          <span class="integral-sign" aria-hidden="true">∫</span>
          <input type="text" id="lower-bound" class="bound-input" placeholder="0" />
        </div>
        <div class="integral-body">
          <input type="text" id="expression" placeholder="\sin(x)" autocomplete="off" spellcheck="false" />
          <span class="integral-dvar">
            d<input type="text" id="var-name" class="var-input" placeholder="x" autocomplete="off" spellcheck="false" />
          </span>
        </div>
      </div>
    </section>

    <!-- 3. Contexto -->
    <section class="card">
      <h2>3 · Contexto (opcional)</h2>
      <textarea id="context-text" class="context-textarea" rows="4" placeholder="Describe el contexto o propósito de este cálculo. Se incluirá en el PDF."></textarea>
    </section>

    <div class="solve-bar">
      <button type="button" id="solve-btn">Resolver</button>
      <input type="text" id="pdf-title" class="pdf-title-input" placeholder="Título del informe (para el PDF)" />
      <button type="button" id="pdf-btn" class="btn-secondary">⬇ Descargar PDF</button>
      <button type="button" id="clear-btn" class="btn-add">🗑 Limpiar todo</button>
    </div>

    <div id="error-box"></div>

    <section id="results" class="card">
      <h2>Resultado</h2>
      <div id="results-list"></div>
      <p class="result-detail" id="result-detail"></p>
    </section>

    <!-- Historial de resultados -->
    <section id="history-section" class="card">
      <div class="card-header-row">
        <h2>Historial de resultados</h2>
        <button type="button" id="clear-history-btn" class="btn-add">🗑 Limpiar historial</button>
      </div>
      <div id="history-list"></div>
      <p class="result-detail" id="history-empty">Aún no hay resultados calculados en esta sesión.</p>
    </section>
  </main>

  <!-- Reporte imprimible (oculto en pantalla, se llena al pulsar "Descargar PDF") -->
  <div id="print-report"></div>

  <footer class="site-footer">
    <p>por josegonandez</p>
  </footer>

  <script src="js/complex.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/evaluator.js"></script>
  <script src="js/linsolve.js"></script>
  <script src="js/integral.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/app-integral.js"></script>
</body>
</html>
