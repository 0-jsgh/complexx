<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistemas Eq</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <span class="site-header__brand">Resolver</span>
    <nav class="site-header__nav">
      <a href="index.html" aria-current="page">Sistemas Eq</a>
      <a href="integral.html">Integrales</a>
      <a href="ayuda.html">Ayuda</a>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar entre modo oscuro y claro">☀️</button>
  </header>

  <main>
    <h1>Sistemas Eq</h1>

    <!-- 1. Incógnitas -->
    <section class="card">
      <h2>1 · Variables desconocidas</h2>
      <div id="unknowns-list" class="row-list"></div>
      <button type="button" class="btn-add" id="add-unknown">+ Agregar incógnita</button>
    </section>

    <!-- 2. Variables conocidas -->
    <section class="card">
      <h2>2 · Variables conocidas</h2>
      <div id="knowns-list" class="row-list"></div>
      <button type="button" class="btn-add" id="add-known">+ Agregar variable conocida</button>
    </section>

    <!-- 3. Ecuaciones -->
    <section class="card">
      <h2>3 · Sistema de ecuaciones</h2>
      <div id="equations-list" class="row-list"></div>
    </section>

    <!-- 4. Contexto -->
    <section class="card">
      <h2>4 · Contexto (opcional)</h2>
      <textarea id="context-text" class="context-textarea" rows="4" placeholder="Describe el contexto o propósito de este cálculo. Se incluirá en el PDF."></textarea>
    </section>

    <div class="solve-bar">
      <button type="button" id="solve-btn">Resolver</button>
      <input type="text" id="pdf-title" class="pdf-title-input" placeholder="Título del informe (para el PDF)" />
      <button type="button" id="pdf-btn" class="btn-secondary">⬇ Descargar PDF</button>
      <button type="button" id="clear-btn" class="btn-add">🗑 Limpiar todo</button>
    </div>

    <div id="error-box"></div>

    <section id="results" class="card">
      <h2>Resultado</h2>
      <div id="results-list"></div>
    </section>
  </main>

  <!-- Reporte imprimible (oculto en pantalla, se llena al pulsar "Descargar PDF") -->
  <div id="print-report"></div>

  <footer class="site-footer">
    <p>por josegonandez</p>
  </footer>

  <script src="js/complex.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/evaluator.js"></script>
  <script src="js/linsolve.js"></script>
  <script src="js/highlight.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
